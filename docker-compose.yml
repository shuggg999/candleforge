name: candleforge
# Pin compose project name (and therefore the `<project>_default` docker network
# name) so it doesn't drift with directory renames. Sibling services
# (volume-monitor, telegram-bot) reference `external: name: candleforge_default`
# — keep this in sync if you change the project name here.

services:
  nats:
    # NATS event bus with JetStream (introduce-nats-event-bus). Downstream
    # consumers (volume-monitor, telegram-bot) subscribe to `ohlcv.>`.
    image: nats:2.10-alpine
    container_name: nats
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    command:
      - "-js"                          # enable JetStream
      - "-sd"
      - "/data"                        # JetStream file storage path
      - "-m"
      - "8222"                         # monitoring HTTP endpoint
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-db
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - ${CLICKHOUSE_DATA_DIR:-./data/clickhouse}:/var/lib/clickhouse
      - ./config/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./config/clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE:-crypto_data}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  candleforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: candleforge
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
      - "${WS_HOST_PORT:-8001}:8001"
    depends_on:
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      - CLICKHOUSE_HOST=clickhouse-db
      - CLICKHOUSE_PORT=8123
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - NATS_ENABLE=${NATS_ENABLE:-true}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-crypto_data}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLED_EXCHANGES=${ENABLED_EXCHANGES:-binance}
      - RECOVERY_CHECK_INTERVAL=${RECOVERY_CHECK_INTERVAL:-60}
      - MAX_GAP_MINUTES=${MAX_GAP_MINUTES:-720}
      - TZ=${TZ:-Asia/Shanghai}
      - BINANCE_PROXY_URL=${BINANCE_PROXY_URL:-}
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nats-data:
    # JetStream file storage for the NATS event bus.
