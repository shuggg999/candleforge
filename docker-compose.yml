services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-db
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - ${CLICKHOUSE_DATA_DIR:-/Volumes/FORGE/data/clickhouse}:/var/lib/clickhouse
      - ./config/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./config/clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE:-crypto_data}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  data-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-service
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
      - "${WS_HOST_PORT:-8001}:8001"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - CLICKHOUSE_HOST=clickhouse-db
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-crypto_data}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLED_EXCHANGES=${ENABLED_EXCHANGES:-binance}
      - RECOVERY_CHECK_INTERVAL=${RECOVERY_CHECK_INTERVAL:-60}
      - MAX_GAP_MINUTES=${MAX_GAP_MINUTES:-720}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
